# HISTORICAL — Amplify Hosting decommissioned June 2026. Production frontend: S3+CloudFront.
# Retained for reference only. CI/CD uses GitHub Actions + scripts/deploy-static-site.sh.
# See docs/AWS_INFRASTRUCTURE_SOT.md and docs/pipeline-workflow.md.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24.16.0
        - nvm use 24.16.0
        - npm ci
    build:
      commands:
        - nvm use 24.16.0
        - node scripts/generate-runtime-config.mjs --strict
        - npm run build
  artifacts:
    baseDirectory: dist/townofwiley-app/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*