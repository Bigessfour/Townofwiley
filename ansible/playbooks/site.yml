---
# Town of Wiley — operator deploy orchestration (wraps existing repo scripts).
#
# List tags:  ansible-playbook ansible/playbooks/site.yml --list-tags
# Dry-run:    ansible-playbook ansible/playbooks/site.yml --tags static-site -e deploy_dry_run=true
# Production: ansible-playbook ansible/playbooks/site.yml --tags static-site
#
# Requires: AWS CLI profile (source scripts/agent-aws-env.sh), Node 24, npm ci.
- name: Town of Wiley site operations
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: '{{ playbook_dir | dirname | dirname }}'
  tasks:
    - name: Static site — S3 sync + CloudFront invalidation
      ansible.builtin.import_role:
        name: static_site
      tags:
        - static-site
        - deploy
        - frontend

    - name: Verify infrastructure manifest (offline)
      ansible.builtin.import_role:
        name: verify_infra
      tags:
        - verify
        - infra
