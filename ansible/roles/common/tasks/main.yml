---
- name: Load AWS infrastructure manifest (SSOT)
  ansible.builtin.set_fact:
    aws_manifest: "{{ lookup('file', project_root + '/infrastructure/aws-infrastructure.manifest.json') | from_json }}"

- name: Ensure required AWS CLI is available
  ansible.builtin.command: which aws
  changed_when: false
  failed_when: false
  register: aws_check

- name: Warn if AWS CLI not found
  ansible.builtin.debug:
    msg: AWS CLI not found in PATH. Ensure it is installed and sourced via scripts/agent-aws-env.sh
  when: aws_check.rc != 0
