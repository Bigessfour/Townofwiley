---
collections:
  # Future: uncomment and run `ansible-galaxy collection install -r ansible/requirements.yml`
  # when roles are extended to use native modules (community.aws.iam_policy, community.aws.lambda, etc.)
  # instead of shelling out to the existing deploy-*.py / aws cli commands.
  # Keep the script-calling approach as the default for now (per hybrid IaC decision).
  - name: community.aws
    version: '>=7.0.0'
  - name: amazon.aws
    version: '>=8.0.0'

  # Posix utilities (file, acl, etc.) — safe default include.
  - name: ansible.posix
    version: '>=1.5.0'
