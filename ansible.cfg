[defaults]
# Canonical Ansible config at repo root for auto-discovery.
# When running `ansible-playbook ansible/playbooks/deploy.yml` from the repo root,
# Ansible finds this file automatically (no need for ANSIBLE_CONFIG env in most cases).
# See: https://docs.ansible.com/ansible/latest/reference_appendices/config.html#the-configuration-file

inventory = ansible/inventory/hosts
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
bin_ansible_callbacks = True
roles_path = ansible/roles
remote_tmp = /tmp/.ansible-${USER}

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True
