name: Ollama CI Diagnosis
description: Install Ollama, triage a failed Actions run, upload actionable artifacts, sticky-comment PRs.

inputs:
  run_id:
    description: GitHub Actions run id for the failed workflow
    required: true
  workflow_name:
    description: Display name of the failed workflow (empty fetches from the run API)
    required: false
    default: ''
  model:
    description: Ollama model (llama3.2:3b default for GH runners; override for quality vs RAM)
    required: false
    default: llama3.2:3b

runs:
  using: composite
  steps:
    - name: Resolve failed run metadata
      id: meta
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_RUN_ID: ${{ inputs.run_id }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_WORKFLOW_NAME: ${{ inputs.workflow_name }}
      run: |
        RUN_ID="$INPUT_RUN_ID"
        MODEL="$INPUT_MODEL"
        WORKFLOW_NAME="$INPUT_WORKFLOW_NAME"

        if [ -z "$RUN_ID" ]; then
          echo "No run id to diagnose."
          exit 1
        fi

        RUN_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
        HEAD_SHA=$(echo "$RUN_JSON" | jq -r '.head_sha')
        HEAD_BRANCH=$(echo "$RUN_JSON" | jq -r '.head_branch // "unknown"')
        RUN_URL=$(echo "$RUN_JSON" | jq -r '.html_url')
        if [ -z "$WORKFLOW_NAME" ]; then
          WORKFLOW_NAME=$(echo "$RUN_JSON" | jq -r '.name')
        fi
        EVENT=$(echo "$RUN_JSON" | jq -r '.event')
        CONCLUSION=$(echo "$RUN_JSON" | jq -r '.conclusion // "unknown"')

        echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
        echo "model=$MODEL" >> "$GITHUB_OUTPUT"
        echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
        echo "head_branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
        echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
        echo "workflow_name=$WORKFLOW_NAME" >> "$GITHUB_OUTPUT"
        echo "event=$EVENT" >> "$GITHUB_OUTPUT"
        echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"

    - name: Checkout failed revision
      uses: actions/checkout@v6
      with:
        ref: ${{ steps.meta.outputs.head_sha }}

    - name: Setup Ollama
      uses: ./.github/actions/setup-ollama
      with:
        model: ${{ steps.meta.outputs.model }}
        version: ${{ vars.OLLAMA_VERSION || '' }}
      continue-on-error: true

    - name: Run CI failure diagnosis
      shell: bash
      env:
        OLLAMA_MODEL: ${{ steps.meta.outputs.model }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        FAILED_WORKFLOW_NAME: ${{ steps.meta.outputs.workflow_name }}
        FAILED_RUN_URL: ${{ steps.meta.outputs.run_url }}
        FAILED_HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
        FAILED_HEAD_BRANCH: ${{ steps.meta.outputs.head_branch }}
        FAILED_EVENT: ${{ steps.meta.outputs.event }}
        FAILED_CONCLUSION: ${{ steps.meta.outputs.conclusion }}
        GH_TOKEN: ${{ github.token }}
      run: |
        chmod +x scripts/ollama_ci_diagnosis.sh
        scripts/ollama_ci_diagnosis.sh "${{ steps.meta.outputs.run_id }}"

    - name: Upload AI diagnosis artifacts
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: ollama-ci-diagnosis-${{ steps.meta.outputs.run_id }}
        path: outputs/
        retention-days: 30
        if-no-files-found: warn

    - name: Sticky comment diagnosis on PR
      if: always() && steps.meta.outputs.conclusion == 'failure'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${{ steps.meta.outputs.head_sha }}/pulls" \
          --jq '[.[] | select(.state == "open")][0].number' 2>/dev/null || true)
        if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
          echo "No open PR for SHA ${{ steps.meta.outputs.head_sha }} — see job Summary and artifacts."
          exit 0
        fi

        {
          echo "<!-- tow-sticky:ollama-ci-diagnosis -->"
          echo "## Ollama CI Diagnosis"
          echo ""
          echo "_Advisory triage — does not replace the required CI gate._"
          echo ""
          echo "**Workflow:** ${{ steps.meta.outputs.workflow_name }}"
          echo "**Failed run:** [${{ steps.meta.outputs.run_id }}](${{ steps.meta.outputs.run_url }})"
          echo "**Model:** \`${{ steps.meta.outputs.model }}\`"
          echo ""
          if [ -f outputs/ACTIONABLE.md ]; then
            echo "### Actionable fix"
            # Skip H1 title; keep checklist body compact for comments
            sed -n '3,55p' outputs/ACTIONABLE.md
            echo ""
          fi
          if [ -f outputs/00-deterministic-triage.txt ]; then
            echo "### Deterministic facts (ground truth)"
            echo '```'
            head -n 25 outputs/00-deterministic-triage.txt
            echo '```'
            echo ""
          fi
          if [ -f outputs/05-quality-review.txt ]; then
            echo "### Reviewed summary"
            echo '```'
            sed -n '/MERGED_SUMMARY:/,/CONFIDENCE:/p' outputs/05-quality-review.txt | head -n 12
            echo '```'
            echo ""
          fi
          echo "### Triage"
          echo '```'
          sed -n '/FAILING_JOB:/,/CONFIDENCE:/p' outputs/01-triage.txt 2>/dev/null | head -n 35 || head -n 40 outputs/01-triage.txt 2>/dev/null || echo "(triage unavailable — use ACTIONABLE.md in artifact)"
          echo '```'
          echo ""
          echo "Full reports: workflow artifact \`ollama-ci-diagnosis-${{ steps.meta.outputs.run_id }}\` (\`ACTIONABLE.md\`, \`06-actionable.json\`)."
        } > /tmp/ollama-pr-comment.md

        node scripts/lib/ollama-sticky-comment.mjs "$PR_NUMBER" ollama-ci-diagnosis /tmp/ollama-pr-comment.md
