name: Cache Ollama models
description: Restore ~/.ollama/models to avoid repeated large model downloads.

inputs:
  model:
    description: Ollama model tag (cache key segment)
    required: true

runs:
  using: composite
  steps:
    - name: Cache Ollama model weights
      uses: actions/cache@v5
      with:
        path: ~/.ollama/models
        # Key primarily by model tag so prompt/script edits do not force cold pulls.
        key: ollama-models-${{ inputs.model }}-v2
        restore-keys: |
          ollama-models-${{ inputs.model }}-
          ollama-models-
