# Manual production deploy: build → S3 sync → CloudFront invalidation.
# Requires repository secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (townofwiley account).
name: Deploy static site (S3 + CloudFront)

on:
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Use existing dist/ artifact from a prior build (not recommended)'
        required: false
        default: false
        type: boolean
      wait_invalidation:
        description: 'Wait until CloudFront invalidation completes'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-static-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Deploy to S3 and invalidate CloudFront
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-2
          AWS_REGION: us-east-2
          STRICT_RUNTIME_CONFIG: '1'
          APPSYNC_CMS_ENDPOINT: ${{ secrets.APPSYNC_CMS_ENDPOINT }}
          APPSYNC_CMS_API_KEY: ${{ secrets.APPSYNC_CMS_API_KEY }}
          APPSYNC_CMS_REGION: ${{ secrets.APPSYNC_CMS_REGION }}
          NWS_PROXY_ENDPOINT: ${{ secrets.NWS_PROXY_ENDPOINT }}
          SEVERE_WEATHER_SIGNUP_API_ENDPOINT: ${{ secrets.SEVERE_WEATHER_SIGNUP_API_ENDPOINT }}
          SEVERE_WEATHER_SIGNUP_ENABLED: ${{ secrets.SEVERE_WEATHER_SIGNUP_ENABLED }}
          EASYPEASY_API_ENDPOINT: ${{ secrets.EASYPEASY_API_ENDPOINT }}
          EASYPEASY_CHAT_URL: ${{ secrets.EASYPEASY_CHAT_URL }}
          CONTACT_UPDATE_REVIEW_API_URL: ${{ secrets.CONTACT_UPDATE_REVIEW_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "::error::Missing AWS_ACCESS_KEY_ID repository secret"
            exit 1
          fi
          ARGS=()
          if [ "${{ inputs.skip_build }}" = "true" ]; then
            ARGS+=(--skip-build)
          fi
          if [ "${{ inputs.wait_invalidation }}" = "true" ]; then
            ARGS+=(--wait-invalidation)
          fi
          node scripts/deploy-static-site.mjs "${ARGS[@]}"
