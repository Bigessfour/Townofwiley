# Live hosting E2E — run against deployed Amplify main or production (not PR local ng serve).
# Complements hosting-headers-drift-watch.yml (CSP probes) with Playwright route + runtime-config checks.
#
# Set repository variable E2E_AMPLIFY_MAIN_URL (e.g. https://main.d331voxr1fhoir.amplifyapp.com) for staging default.
name: E2E live hosting

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        options:
          - staging
          - production
        default: staging
      base_url:
        description: Optional E2E_BASE_URL override (must be https://…)
        required: false
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: 24.16.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
  NG_CLI_ANALYTICS: 'false'

jobs:
  live-hosting-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Resolve E2E_BASE_URL
        id: base_url
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.base_url }}" ]; then
            echo "url=${{ inputs.base_url }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.target }}" = "production" ]; then
            echo "url=https://www.townofwiley.gov/" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ vars.E2E_AMPLIFY_MAIN_URL }}" ]; then
            echo "url=${{ vars.E2E_AMPLIFY_MAIN_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set repository variable E2E_AMPLIFY_MAIN_URL or pass base_url input for staging."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: timeout 900 npm run test:e2e:install
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}

      - name: E2E preflight
        run: python3 scripts/e2e_smoke_preflight.py

      - name: Run live hosting specs
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            npm run test:e2e:live:production
          else
            E2E_BASE_URL="${{ steps.base_url.outputs.url }}" npm run test:e2e:live:staging
          fi
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-live-hosting-report-${{ inputs.target }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
