# Advisory Ollama code review on pull requests (does not gate merge).
name: Ollama PR review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ollama-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ollama-pr-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Ollama
        uses: ./.github/actions/setup-ollama
        with:
          # Prefer coder model when var set; default stays small for free GH runners.
          model: ${{ vars.OLLAMA_PR_REVIEW_MODEL || 'llama3.2:3b' }}
          # vars.* only valid in workflow YAML (not nested composite expressions).
          version: ${{ vars.OLLAMA_VERSION || '' }}

      - name: Post advisory PR review comment
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_PR_REVIEW_MODEL || 'llama3.2:3b' }}
        run: node scripts/ollama-pr-review.mjs

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ollama-pr-review-${{ github.event.pull_request.number }}
          path: outputs/pr-review/
          retention-days: 14
          if-no-files-found: ignore
