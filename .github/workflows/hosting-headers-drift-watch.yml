# Probes production hosting for baseline security headers (CSP) so drift is caught
# Complements scripts/verify-custom-http-yaml.mjs (repo) and e2e live header checks.
# (repo file parity) and e2e/specs/smoke/live-hosting-headers.spec.ts (full header set).
#
# Noise control: when repository secrets provide Wiley AWS credentials, push
# customHttp.yml via npm run amplify:sync-headers before the live check; always
# wait 30s so CloudFront can pick up app-level header changes after sync/deploy.
#
# AWS context: custom headers can be set in the Amplify console, in customHttp.yml
# (repo), or historically in amplify.yml — see:
# https://docs.aws.amazon.com/amplify/latest/userguide/custom-headers.html
name: Hosting headers drift watch

on:
  workflow_dispatch:
  schedule:
    # Daily 14:00 UTC — catches live CSP / edge drift quickly (complements CloudTrail→EventBridge on UpdateApp)
    - cron: 0 14 * * *

permissions:
  contents: read

env:
  NODE_VERSION: 24.16.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
  NG_CLI_ANALYTICS: 'false'

jobs:
  check-production-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify repo customHttp.yml (offline)
        run: node scripts/verify-custom-http-yaml.mjs

      - name: Install jq (Amplify sync script)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Sync Amplify custom headers from customHttp.yml
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-2
          AWS_REGION: us-east-2
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "Skipping Amplify sync (no AWS_ACCESS_KEY_ID repository secret)"
            exit 0
          fi
          npm run amplify:sync-headers

      - name: Wait for Hosting header propagation
        run: sleep 30

      - name: Probe live CSP baseline tokens
        env:
          E2E_BASE_URL: https://www.townofwiley.gov/
        run: npm run verify:live-csp-probe

      - name: Compare live CSP to repo customHttp.yml
        env:
          E2E_BASE_URL: https://www.townofwiley.gov/
        run: npm run verify:live-csp-vs-repo

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies (Playwright live CSP check)
        run: npm ci --no-audit

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: timeout 900 npm run test:e2e:install
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}

      - name: Live homepage CSP inline-style console check
        env:
          E2E_BASE_URL: https://www.townofwiley.gov/
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        run: npm run test:e2e:live:csp-inline-style
