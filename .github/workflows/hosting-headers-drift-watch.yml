# Probes production hosting for baseline security headers (CSP) so drift is caught.
# Complements scripts/verify-custom-http-yaml.mjs (repo) and e2e live header checks.
#
# Current hosting (S3 + CloudFront): CSP + security headers served via CloudFront
# Response Headers Policy (attached to default behavior; see policy ID in manifest
# and customHttp.yml as SSOT). Amplify sync is historical/no-op for prod (app deleted).
# The probe + compare steps act as canary for missing/mismatched headers.
#
# If AWS secrets present, the (historical) sync step will now gracefully skip for
# decommissioned Amplify app.
#
# See: docs/AWS_INFRASTRUCTURE_SOT.md, README (S3+CF section), customHttp.yml.
name: Hosting headers drift watch

on:
  workflow_dispatch:
  schedule:
    # Daily 14:00 UTC — catches live CSP / edge drift quickly (complements CloudTrail→EventBridge on UpdateApp)
    - cron: 0 14 * * *

permissions:
  contents: read

env:
  NODE_VERSION: 24.16.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
  NG_CLI_ANALYTICS: 'false'

jobs:
  check-production-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify repo customHttp.yml (offline)
        run: node scripts/verify-custom-http-yaml.mjs

      - name: Install jq (Amplify sync script)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Sync Amplify custom headers (historical; skipped for S3+CF prod)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-2
          AWS_REGION: us-east-2
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "Skipping Amplify sync (no AWS_ACCESS_KEY_ID repository secret; CSP now via CloudFront Response Headers Policy)"
            exit 0
          fi
          npm run amplify:sync-headers

      - name: Wait for edge propagation (if any sync)
        run: sleep 30

      - name: Probe live CSP baseline tokens
        env:
          E2E_BASE_URL: https://www.townofwiley.gov/
        run: npm run verify:live-csp-probe

      - name: Compare live CSP to repo customHttp.yml
        env:
          E2E_BASE_URL: https://www.townofwiley.gov/
        run: npm run verify:live-csp-vs-repo

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies (Playwright live CSP check)
        run: npm ci --no-audit

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: ./.github/actions/cache-playwright-chromium
        with:
          browsers_path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: timeout 900 npm run test:e2e:install
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}

      - name: Live homepage CSP inline-style console check
        env:
          E2E_BASE_URL: https://www.townofwiley.gov/
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        run: npm run test:e2e:live:csp-inline-style
