# Thin caller so required check stays: site-ci / CI gate (merge required)
# Jobs live in site-ci.yml (workflow_call).
name: Site CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  site-ci:
    uses: ./.github/workflows/site-ci.yml
    secrets: inherit
