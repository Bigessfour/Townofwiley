name: Site CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # OIDC for deploy-production job in reusable workflow

# E2E regression (smoke + interaction inventory) runs in git-workflow.yml → frontend-smoke.
jobs:
  site-ci:
    uses: ./.github/workflows/git-workflow.yml
    secrets: inherit
