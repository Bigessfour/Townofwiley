name: Site CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # OIDC for deploy-production job in reusable workflow
  actions: read # Ollama CI triage reads failed run logs
  pull-requests: write # Ollama CI triage comments on PRs

# E2E smoke-critical (`npm run test:e2e:smoke`) runs in git-workflow.yml → frontend-smoke.
# Full Playwright regression is local/ops (`npm run test:e2e:regression`), not on every PR.
jobs:
  site-ci:
    uses: ./.github/workflows/git-workflow.yml
    secrets: inherit
