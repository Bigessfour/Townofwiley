# Full E2E regression — all smoke specs plus accessibility, responsive, and typography.
name: E2E regression (nightly)

on:
  workflow_dispatch:
  schedule:
    - cron: 0 6 * * *

permissions:
  contents: read

env:
  NODE_VERSION: 24.16.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
  NG_CLI_ANALYTICS: 'false'

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: timeout 900 npm run test:e2e:install
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}

      - name: E2E preflight
        run: python3 scripts/e2e_smoke_preflight.py

      - name: Run full E2E regression suite
        run: npm run test:e2e:regression
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
