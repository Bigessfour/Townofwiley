name: 'Copilot Setup Steps'

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm

      - name: Restore Angular CLI cache
        uses: ./.github/actions/cache-angular-cli

      - name: Install dependencies
        run: npm ci

      - name: Lint (fast feedback for Copilot workspaces)
        run: npm run lint

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: ./.github/actions/cache-playwright-chromium
        with:
          browsers_path: ~/.cache/ms-playwright

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: timeout 900 npm run test:e2e:install
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

      # Copilot workspaces lack production secrets — build:ci uses non-strict runtime config.
      - name: Build application (CI production build)
        run: npm run build:ci
