# Manual entry point for diagnosing a past failed Site CI run by id.
# Automatic triage also runs in git-workflow.yml when the CI gate fails.
name: Ollama CI Diagnosis

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: GitHub Actions run id to diagnose (from Actions URL)
        required: true
        type: string
      model:
        description: Ollama model (llama3.2:3b recommended on hosted runners)
        required: false
        default: llama3.2:3b
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: ollama-ci-diagnosis-manual-${{ github.event.inputs.run_id }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Run Ollama failure diagnosis
        uses: ./.github/actions/ollama-ci-diagnosis
        with:
          run_id: ${{ github.event.inputs.run_id }}
          model: ${{ github.event.inputs.model }}
          workflow_name: Site CI
          ollama_version: ${{ vars.OLLAMA_VERSION || '' }}