# Town of Wiley — project-scoped Grok Build MCP servers.
# Only [mcp_servers] is supported here; global UI/models live in ~/.grok/config.toml.
# See docs/grok-cli.md and https://docs.x.ai/build/overview

[mcp_servers.angular-cli]
command = "npx"
args = ["-y", "@angular/cli@21.2.5", "mcp", "--experimental-tool", "modernize"]
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.primeng]
command = "powershell"
args = ["-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/primeng-mcp.ps1"]
enabled = true                                                 # pinned mcp/primeng — run npm run mcp:primeng:install once
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.playwright-test]
command = "npx"
args = ["-y", "playwright", "run-test-mcp-server"]
env = { PLAYWRIGHT_BROWSERS_PATH = ".playwright-browsers" }
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 180

[mcp_servers."playwright-mcp"]
command = "npx"
args = [
  "-y",
  "@playwright/mcp@latest",
  "--config",
  "playwright-mcp.config.json",
]
env = { PLAYWRIGHT_BROWSERS_PATH = ".playwright-browsers" }
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 180

# Chrome DevTools for agents (MCP server for Chrome AI / DevTools integration).
# See https://developer.chrome.com/docs/devtools/agents/get-started
# and the Chrome 149 "DevTools for agents" announcement.
# Allows agents to inspect, emulate, audit (Lighthouse), debug, etc. a live Chrome instance.
[mcp_servers."chrome-devtools"]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 180

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"
enabled = true
startup_timeout_sec = 15
tool_timeout_sec = 120

[mcp_servers.townofwiley-rag]
# Native Node on Windows (PowerShell default terminal); ripgrep used when on PATH.
command = "powershell"
args = ["-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "node scripts/rag-mcp.mjs"]
enabled = true
startup_timeout_sec = 90
tool_timeout_sec = 120
