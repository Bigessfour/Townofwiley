# Town of Wiley — project-scoped Grok Build MCP servers.
# Only [mcp_servers] is supported here; global UI/models live in ~/.grok/config.toml.
# See docs/grok-cli.md and https://docs.x.ai/build/overview

[mcp_servers.angular-cli]
command = "npx"
args = ["-y", "@angular/cli@21.2.5", "mcp", "--experimental-tool", "modernize"]
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.primeng]
command = "node"
args = ["mcp/primeng/node_modules/@primeng/mcp/dist/index.js"]
enabled = true                                                 # pinned mcp/primeng (sdk 1.25.2) — see mcp/primeng/README.md
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.playwright-test]
command = "npx"
args = ["-y", "playwright", "run-test-mcp-server"]
env = { PLAYWRIGHT_BROWSERS_PATH = ".playwright-browsers" }
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 180

[mcp_servers."playwright-mcp"]
command = "npx"
args = [
  "-y",
  "@playwright/mcp@latest",
  "--config",
  "playwright-mcp.config.json",
]
env = { PLAYWRIGHT_BROWSERS_PATH = ".playwright-browsers" }
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 180

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"
enabled = true
startup_timeout_sec = 15
tool_timeout_sec = 120

[mcp_servers.townofwiley-rag]
command = "node"
args = ["scripts/rag-mcp.mjs"]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 120
