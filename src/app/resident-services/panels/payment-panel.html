<div
  class="resident-service-card resident-service-card--active grid gap-5 p-6 rounded-2xl"
  id="payment-help"
>
  <div class="resident-service-intro grid gap-2">
    <p class="meta-label">{{ copy().paymentMeta }}</p>
    <i [class]="'pi ' + copy().paymentIcon" aria-hidden="true"></i>
    <h2>{{ copy().paymentTitle }}</h2>
    <p>{{ copy().paymentBody }}</p>
  </div>

  <div class="resident-contact-row flex flex-wrap gap-2">
    @if (townHallPhoneHref()) {
      <a class="resident-contact-link" [attr.href]="townHallPhoneHref()">
        {{ copy().phoneFallbackLabel }} · {{ townHallPhoneLabel() }}
      </a>
    }
    @if (clerkEmailHref()) {
      <a class="resident-contact-link" [attr.href]="clerkEmailHref()">
        {{ copy().emailFallbackLabel }} · {{ clerkEmailLabel() }}
      </a>
    }
  </div>

  <div class="resident-pay-bill-link">
    <a
      pButton
      pRipple
      routerLink="/pay-bill"
      class="p-button-sm"
      icon="pi pi-arrow-right"
      [label]="copy().payBillLinkLabel"
      [attr.aria-label]="copy().payBillLinkLabel"
      data-testid="resident-pay-bill-link"
    ></a>
  </div>
</div>
