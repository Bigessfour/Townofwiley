<p-card id="weather-alerts" class="resident-service-stage-card">
  <div class="resident-service-stage-inner grid gap-4">
    <p class="meta-label">{{ copy().weatherMeta }}</p>
    <i [class]="'pi ' + copy().weatherIcon" aria-hidden="true"></i>
    <h2>{{ copy().weatherTitle }}</h2>
    <p>{{ copy().weatherBody }}</p>
    <div class="resident-action-row">
      <a
        pButton
        pRipple
        routerLink="/weather"
        class="p-button-sm"
        [attr.aria-label]="copy().weatherCta"
      >
        <i class="pi pi-cloud" aria-hidden="true"></i>
        {{ copy().weatherCta }}
      </a>
    </div>
  </div>
</p-card>
