<section class="feature-detail-stack">
  <p-card class="panel wiley-panel" id="privacy">
    <ng-template pTemplate="header">
      <div class="wiley-page-header">
        <p class="section-kicker">{{ copy().kicker }}</p>
        <h1>{{ copy().title }}</h1>
      </div>
    </ng-template>
    <p class="feature-hub-copy">{{ copy().intro }}</p>
    <p class="policy-last-updated meta-label" data-testid="privacy-last-updated">
      {{ copy().lastUpdatedLabel }}: {{ copy().lastUpdatedDate }}
    </p>
    <div class="stack-list">
      @for (item of copy().items; track item.title) {
        <article class="info-row">
          <strong>{{ item.title }}</strong>
          <span>{{ item.detail }}</span>
        </article>
      }
    </div>
  </p-card>
</section>
