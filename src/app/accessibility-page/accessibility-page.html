<section class="feature-detail-stack">
  <p-card class="panel wiley-panel" id="accessibility">
    <ng-template pTemplate="header">
      <div class="wiley-page-header">
        <p class="section-kicker">{{ copy().accessibilityKicker }}</p>
        <h1>{{ copy().accessibilityHeading }}</h1>
      </div>
    </ng-template>
    <div class="stack-list">
      @for (item of accessibilityItems(); track item.title) {
        <article class="info-row accessibility-row">
          <strong>{{ item.title }}</strong>
          <span>{{ item.detail }}</span>
        </article>
      }
    </div>
    <p class="compliance-note">{{ copy().complianceNote }}</p>
    <p class="policy-last-updated meta-label" data-testid="accessibility-last-reviewed">
      {{ copy().accessibilityLastReviewedLabel }}: {{ copy().accessibilityLastReviewedDate }}
    </p>
    <app-accessibility-support [contacts]="contacts()" />
  </p-card>
</section>
